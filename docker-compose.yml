services:
  workbench:
    build: .
    container_name: ai-workbench
    restart: unless-stopped
    ports:
      - "8720:8000" # 宿主端口可按需改，容器内固定 8000
    env_file:
      - .env # APP_ENV/ACCESS_TOKEN/密钥等（服务器上从 .env.example 复制填写）
    environment:
      APP_ENV: production
      DATA_DIR: /app/data
      DIST_DIR: /app/static
    volumes:
      - ./data:/app/data # 配置、生成的图片、解析结果、任务记录全部持久化在宿主
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/auth/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
